<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Particle System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', monospace;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* Moving grid */
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.03;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        /* Vignette effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 40%,
                rgba(0, 0, 0, 0.4) 70%,
                rgba(0, 0, 0, 0.8) 100%
            );
        }

        /* HUD styling */
        .hud {
            position: fixed;
            color: #00FFFF;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow:
                0 0 5px #00FFFF,
                0 0 10px #00FFFF,
                0 0 20px #00FFFF;
            z-index: 10;
            padding: 15px;
            pointer-events: none;
        }

        .hud-tl {
            top: 0;
            left: 0;
        }

        .hud-tr {
            top: 0;
            right: 0;
            text-align: right;
        }

        .hud-bl {
            bottom: 0;
            left: 0;
        }

        .hud-br {
            bottom: 0;
            right: 0;
            text-align: right;
        }

        .hud-bc {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            display: none;
        }

        .hud-bc .hud-value {
            color: #FF6600;
            text-shadow:
                0 0 5px #FF6600,
                0 0 10px #FF6600,
                0 0 20px #FF6600;
            border-bottom: 2px solid #FF6600;
            padding-bottom: 5px;
        }

        .hud-label {
            opacity: 0.6;
            font-size: 10px;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 14px;
            font-weight: 700;
        }

        .hud-border {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00FFFF;
            border-style: solid;
            opacity: 0.5;
        }

        .hud-tl .hud-border {
            top: 5px;
            left: 5px;
            border-width: 2px 0 0 2px;
        }

        .hud-tr .hud-border {
            top: 5px;
            right: 5px;
            border-width: 2px 2px 0 0;
        }

        .hud-bl .hud-border {
            bottom: 5px;
            left: 5px;
            border-width: 0 0 2px 2px;
        }

        .hud-br .hud-border {
            bottom: 5px;
            right: 5px;
            border-width: 0 2px 2px 0;
        }

        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            transform: scaleX(-1); /* Mirror the video */
            opacity: 0.4; /* Dim for cyberpunk effect */
            filter: saturate(0.3) contrast(1.2); /* Desaturated, high contrast */
        }

        #text-canvas {
            display: none;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #00FFFF;
            font-family: 'Orbitron', monospace;
        }

        #loading h1 {
            font-size: 24px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00FFFF;
            margin-bottom: 20px;
        }

        #loading p {
            font-size: 12px;
            opacity: 0.7;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading">
        <h1>INITIALIZING</h1>
        <p>LOADING HAND TRACKING...</p>
    </div>

    <!-- Three.js canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- Effects overlays -->
    <div class="scanlines"></div>
    <div class="grid"></div>
    <div class="vignette"></div>

    <!-- HUD Elements -->
    <div class="hud hud-tl">
        <div class="hud-border"></div>
        <div class="hud-label">FPS</div>
        <div class="hud-value" id="fps-display">60</div>
    </div>

    <div class="hud hud-tr">
        <div class="hud-border"></div>
        <div class="hud-label">PARTICLES</div>
        <div class="hud-value" id="particle-display">12000</div>
    </div>

    <div class="hud hud-bl">
        <div class="hud-border"></div>
        <div class="hud-label">LEFT HAND (COMMAND)</div>
        <div class="hud-value" id="left-hand-display">IDLE</div>
    </div>

    <div class="hud hud-br">
        <div class="hud-border"></div>
        <div class="hud-label">RIGHT HAND (PHYSICS)</div>
        <div class="hud-value" id="right-hand-display">IDLE</div>
    </div>

    <div class="hud hud-bc" id="combo-display">
        <div class="hud-value" id="combo-text">BASKETBALL</div>
    </div>

    <!-- Hidden elements -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="text-canvas"></canvas>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            PARTICLE_COUNT: 12000,
            PARTICLE_SIZE: 2.4,
            LERP_FACTOR: 0.16,
            REPULSION_RADIUS: 150,
            REPULSION_STRENGTH: 1200,
            NEBULA_SPREAD: 500,
            RIPPLE_FREQUENCY: 0.08,
            RIPPLE_AMPLITUDE: 40,
            BOUNCE_FREQUENCY: 15,
            BOUNCE_AMPLITUDE: 60,
            GESTURE_DEBOUNCE: 150
        };

        const COLORS = {
            NEON_BLUE: 0x00FFFF,
            NEON_YELLOW: 0xFFFF00,
            NEON_PINK: 0xFF00FF,
            NEON_GREEN: 0x00FF88,
            ORANGE: 0xFF6600,
            BLACK: 0x000000
        };

        const SHAPES = {
            1: { text: 'Hello', color: COLORS.NEON_BLUE },
            2: { text: '生き甲斐', color: COLORS.NEON_YELLOW },
            3: { text: 'Вукојѐбина', color: COLORS.NEON_PINK },
            4: { text: 'Schützengrabenvernichtungspanzerkraftwagen', color: COLORS.NEON_GREEN }
        };

        // ==================== GLOBAL STATE ====================
        let scene, camera, renderer, particles;
        let positions, colors, targets, velocities;
        let textCanvas, textCtx;
        let hands, webcamElement;
        let currentShape = null;
        let lastGestureTime = 0;
        let leftHandFingers = 0;
        let rightHandFingers = 0;
        let leftHandPos = null;
        let rightHandPos = null;
        let isNebulaMode = false;
        let isCatchMode = false;
        let isBasketballMode = false;
        let isIdleMode = true;
        let basketballRotation = 0;
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let fps = 60;
        let shapeCache = {};
        let nebulaTargets = null;
        let idleTargets = null;
        let time = 0;

        // ==================== THREE.JS SETUP ====================
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = null; // Transparent to show webcam behind

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('three-canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            shapeCache = {}; // Clear cache on resize
        }

        // ==================== PARTICLE SYSTEM ====================
        function createParticleSystem() {
            const geometry = new THREE.BufferGeometry();

            positions = new Float32Array(CONFIG.PARTICLE_COUNT * 3);
            colors = new Float32Array(CONFIG.PARTICLE_COUNT * 3);
            targets = new Float32Array(CONFIG.PARTICLE_COUNT * 3);
            velocities = new Float32Array(CONFIG.PARTICLE_COUNT * 3);

            // Initialize particles in random positions
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 800;
                positions[i3 + 1] = (Math.random() - 0.5) * 600;
                positions[i3 + 2] = (Math.random() - 0.5) * 200;

                targets[i3] = positions[i3];
                targets[i3 + 1] = positions[i3 + 1];
                targets[i3 + 2] = positions[i3 + 2];

                // Initial color: dim cyan
                const color = new THREE.Color(COLORS.NEON_BLUE);
                colors[i3] = color.r * 0.3;
                colors[i3 + 1] = color.g * 0.3;
                colors[i3 + 2] = color.b * 0.3;

                velocities[i3] = 0;
                velocities[i3 + 1] = 0;
                velocities[i3 + 2] = 0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: CONFIG.PARTICLE_SIZE,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // ==================== TEXT TO PARTICLES ====================
        function initTextCanvas() {
            textCanvas = document.getElementById('text-canvas');
            textCtx = textCanvas.getContext('2d');
        }

        function generateTextCoordinates(text) {
            if (shapeCache[text]) {
                return shapeCache[text];
            }

            const fontSize = 75;
            textCtx.font = `bold ${fontSize}px Arial, sans-serif`;

            const metrics = textCtx.measureText(text);
            const textWidth = metrics.width;
            const textHeight = fontSize * 1.2;

            textCanvas.width = Math.ceil(textWidth) + 20;
            textCanvas.height = Math.ceil(textHeight) + 20;

            textCtx.fillStyle = '#000';
            textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);

            textCtx.font = `bold ${fontSize}px Arial, sans-serif`;
            textCtx.fillStyle = '#FFF';
            textCtx.textBaseline = 'middle';
            textCtx.textAlign = 'center';
            textCtx.fillText(text, textCanvas.width / 2, textCanvas.height / 2);

            const imageData = textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);
            const pixels = imageData.data;
            const coordinates = [];

            const step = 2; // Sample every 2 pixels for density
            for (let y = 0; y < textCanvas.height; y += step) {
                for (let x = 0; x < textCanvas.width; x += step) {
                    const index = (y * textCanvas.width + x) * 4;
                    if (pixels[index] > 128) {
                        coordinates.push({
                            x: (x - textCanvas.width / 2) * 3,
                            y: -(y - textCanvas.height / 2) * 3,
                            z: 0
                        });
                    }
                }
            }

            shapeCache[text] = coordinates;
            return coordinates;
        }

        // ==================== SHAPE GENERATORS ====================
        function generateFibonacciSphere(count, radius) {
            const points = [];
            const goldenRatio = (1 + Math.sqrt(5)) / 2;

            for (let i = 0; i < count; i++) {
                const theta = 2 * Math.PI * i / goldenRatio;
                const phi = Math.acos(1 - 2 * (i + 0.5) / count);

                points.push({
                    x: radius * Math.sin(phi) * Math.cos(theta),
                    y: radius * Math.sin(phi) * Math.sin(theta),
                    z: radius * Math.cos(phi),
                    // UV for seam detection
                    u: theta / (2 * Math.PI),
                    v: phi / Math.PI
                });
            }

            return points;
        }

        function isOnBasketballSeam(u, v) {
            // Basketball has characteristic curved seams
            const seamWidth = 0.03;

            // Horizontal seam
            if (Math.abs(v - 0.5) < seamWidth) return true;

            // Vertical seams (4 curved sections)
            const numVerticalSeams = 4;
            for (let i = 0; i < numVerticalSeams; i++) {
                const seamU = i / numVerticalSeams;
                if (Math.abs((u % (1/numVerticalSeams)) - seamU % (1/numVerticalSeams)) < seamWidth * 0.5) {
                    return true;
                }
            }

            // Curved cross seams
            const curveOffset = Math.sin(v * Math.PI) * 0.1;
            if (Math.abs((u + curveOffset) % 0.5 - 0.25) < seamWidth) return true;

            return false;
        }

        function generateNebulaPositions() {
            const positions = [];
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                positions.push({
                    x: (Math.random() - 0.5) * CONFIG.NEBULA_SPREAD * 2,
                    y: (Math.random() - 0.5) * CONFIG.NEBULA_SPREAD * 1.5,
                    z: (Math.random() - 0.5) * CONFIG.NEBULA_SPREAD
                });
            }
            return positions;
        }

        function generateIdlePositions() {
            const positions = [];
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                positions.push({
                    x: (Math.random() - 0.5) * 900,
                    y: (Math.random() - 0.5) * 700,
                    z: (Math.random() - 0.5) * 300
                });
            }
            return positions;
        }

        function setIdleSpread() {
            if (!idleTargets) {
                idleTargets = generateIdlePositions();
            }

            const color = new THREE.Color(COLORS.NEON_BLUE);

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                targets[i3] = idleTargets[i].x;
                targets[i3 + 1] = idleTargets[i].y;
                targets[i3 + 2] = idleTargets[i].z;

                // Dim cyan color for idle state
                colors[i3] = color.r * 0.4;
                colors[i3 + 1] = color.g * 0.4;
                colors[i3 + 2] = color.b * 0.4;
            }

            particles.geometry.attributes.color.needsUpdate = true;
        }

        // ==================== MEDIAPIPE HANDS ====================
        function initMediaPipe() {
            webcamElement = document.getElementById('webcam');

            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            // Start camera
            const camera = new Camera(webcamElement, {
                onFrame: async () => {
                    await hands.send({ image: webcamElement });
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                document.getElementById('loading').style.display = 'none';
            }).catch(err => {
                console.error('Camera error:', err);
                document.getElementById('loading').innerHTML = '<h1>CAMERA ERROR</h1><p>Please allow camera access</p>';
            });
        }

        function countExtendedFingers(landmarks, isLeftHand) {
            let count = 0;

            // Thumb - compare tip.x to IP joint based on hand
            const thumbTip = landmarks[4];
            const thumbIP = landmarks[3];
            const thumbMCP = landmarks[2];

            if (isLeftHand) {
                if (thumbTip.x > thumbIP.x) count++;
            } else {
                if (thumbTip.x < thumbIP.x) count++;
            }

            // Other fingers - compare tip.y to PIP joint
            const fingerTips = [8, 12, 16, 20];
            const fingerPIPs = [6, 10, 14, 18];

            for (let i = 0; i < 4; i++) {
                if (landmarks[fingerTips[i]].y < landmarks[fingerPIPs[i]].y) {
                    count++;
                }
            }

            return count;
        }

        function landmarkTo3D(landmark) {
            // Convert normalized coordinates to 3D space
            return {
                x: (landmark.x - 0.5) * -800, // Flip X for mirror effect
                y: (0.5 - landmark.y) * 600,
                z: -landmark.z * 200
            };
        }

        function onHandResults(results) {
            leftHandFingers = 0;
            rightHandFingers = 0;
            leftHandPos = null;
            rightHandPos = null;

            if (results.multiHandLandmarks && results.multiHandedness) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const handedness = results.multiHandedness[i];

                    // MediaPipe returns mirrored labels, so we swap them
                    const isLeftHand = handedness.label === 'Right';
                    const fingerCount = countExtendedFingers(landmarks, isLeftHand);

                    if (isLeftHand) {
                        leftHandFingers = fingerCount;
                        leftHandPos = landmarkTo3D(landmarks[9]); // Palm center
                    } else {
                        rightHandFingers = fingerCount;
                        rightHandPos = landmarkTo3D(landmarks[8]); // Index finger tip
                    }
                }
            }

            updateHandStates();
        }

        // ==================== HAND STATE MANAGEMENT ====================
        function updateHandStates() {
            const now = Date.now();

            // Update HUD
            updateHUD();

            // Check for idle mode (no hands detected)
            if (leftHandFingers === 0 && rightHandFingers === 0) {
                if (!isIdleMode) {
                    isIdleMode = true;
                    isBasketballMode = false;
                    isNebulaMode = false;
                    isCatchMode = false;
                    currentShape = null;
                    idleTargets = generateIdlePositions();
                    setIdleSpread();
                }
                return;
            }

            isIdleMode = false;

            // Check for basketball combo first
            if (leftHandFingers === 5 && rightHandFingers === 5) {
                if (!isBasketballMode) {
                    isBasketballMode = true;
                    isNebulaMode = false;
                    isCatchMode = false;
                }
                return;
            }

            isBasketballMode = false;

            // Right hand state
            if (rightHandFingers === 5) {
                if (!isNebulaMode) {
                    isNebulaMode = true;
                    nebulaTargets = generateNebulaPositions();
                    setNebulaTargets();
                }
            } else {
                isNebulaMode = false;
            }

            // Left hand state (only process if not in special modes)
            if (!isBasketballMode) {
                if (leftHandFingers === 5) {
                    isCatchMode = true;
                } else {
                    isCatchMode = false;

                    // Shape switching with debounce
                    if (leftHandFingers >= 1 && leftHandFingers <= 4) {
                        if (now - lastGestureTime > CONFIG.GESTURE_DEBOUNCE) {
                            const shapeData = SHAPES[leftHandFingers];
                            if (currentShape !== shapeData.text) {
                                currentShape = shapeData.text;
                                setTextShape(shapeData.text, shapeData.color);
                                lastGestureTime = now;
                            }
                        }
                    }
                }
            }
        }

        // ==================== PARTICLE TARGET SETTERS ====================
        function setTextShape(text, colorHex) {
            const coords = generateTextCoordinates(text);
            const color = new THREE.Color(colorHex);

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                if (i < coords.length) {
                    targets[i3] = coords[i].x;
                    targets[i3 + 1] = coords[i].y;
                    targets[i3 + 2] = coords[i].z;
                } else {
                    // Extra particles go to random positions around the text
                    const randomCoord = coords[Math.floor(Math.random() * coords.length)];
                    targets[i3] = randomCoord.x + (Math.random() - 0.5) * 50;
                    targets[i3 + 1] = randomCoord.y + (Math.random() - 0.5) * 50;
                    targets[i3 + 2] = (Math.random() - 0.5) * 100;
                }

                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            particles.geometry.attributes.color.needsUpdate = true;
        }

        function setNebulaTargets() {
            if (!nebulaTargets) return;

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                targets[i3] = nebulaTargets[i].x;
                targets[i3 + 1] = nebulaTargets[i].y;
                targets[i3 + 2] = nebulaTargets[i].z;
            }
        }

        function setBasketballShape(centerX, centerY, centerZ) {
            const spherePoints = generateFibonacciSphere(CONFIG.PARTICLE_COUNT, 100);
            const orange = new THREE.Color(COLORS.ORANGE);
            const black = new THREE.Color(COLORS.BLACK);

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const point = spherePoints[i];

                // Apply rotation
                const cos = Math.cos(basketballRotation);
                const sin = Math.sin(basketballRotation);
                const rotatedX = point.x * cos - point.z * sin;
                const rotatedZ = point.x * sin + point.z * cos;

                targets[i3] = centerX + rotatedX;
                targets[i3 + 1] = centerY + point.y;
                targets[i3 + 2] = centerZ + rotatedZ;

                // Color based on seams
                const isSeam = isOnBasketballSeam(point.u, point.v);
                const particleColor = isSeam ? black : orange;

                colors[i3] = particleColor.r;
                colors[i3 + 1] = particleColor.g;
                colors[i3 + 2] = particleColor.b;
            }

            particles.geometry.attributes.color.needsUpdate = true;
        }

        // ==================== PHYSICS ====================
        function applyRepulsion(handX, handY) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                const dx = positions[i3] - handX;
                const dy = positions[i3 + 1] - handY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < CONFIG.REPULSION_RADIUS && distance > 0) {
                    const force = CONFIG.REPULSION_STRENGTH / (distance * distance);
                    const normalizedDx = dx / distance;
                    const normalizedDy = dy / distance;

                    velocities[i3] += normalizedDx * force;
                    velocities[i3 + 1] += normalizedDy * force;
                    // NO Z-axis repulsion - keep it flat
                }
            }
        }

        function applyRippleEffect(handX, handY, handZ) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                const dx = positions[i3] - handX;
                const dy = positions[i3 + 1] - handY;
                const dz = positions[i3 + 2] - handZ;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (distance < CONFIG.NEBULA_SPREAD) {
                    const ripple = Math.sin(distance * CONFIG.RIPPLE_FREQUENCY - time * 5) * CONFIG.RIPPLE_AMPLITUDE;
                    const falloff = 1 - (distance / CONFIG.NEBULA_SPREAD);

                    velocities[i3 + 1] += ripple * falloff * 0.1;
                }
            }
        }

        function applyBouncingAttraction(targetX, targetY, targetZ) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                const dx = targetX - positions[i3];
                const dy = targetY - positions[i3 + 1];
                const dz = targetZ - positions[i3 + 2];
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (distance > 1) {
                    // Attraction force
                    const attractionStrength = 0.08;
                    velocities[i3] += dx * attractionStrength;
                    velocities[i3 + 1] += dy * attractionStrength;
                    velocities[i3 + 2] += dz * attractionStrength;

                    // Bouncing effect
                    const bounceOffset = Math.sin(time * CONFIG.BOUNCE_FREQUENCY + i * 0.1) * CONFIG.BOUNCE_AMPLITUDE;
                    const bounceProgress = Math.max(0, 1 - distance / 500);
                    velocities[i3 + 1] += bounceOffset * bounceProgress * 0.05;
                }
            }
        }

        function updateParticles() {
            const damping = 0.85;

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                // Apply velocity
                positions[i3] += velocities[i3];
                positions[i3 + 1] += velocities[i3 + 1];
                positions[i3 + 2] += velocities[i3 + 2];

                // Dampen velocity
                velocities[i3] *= damping;
                velocities[i3 + 1] *= damping;
                velocities[i3 + 2] *= damping;

                // Lerp towards target
                positions[i3] += (targets[i3] - positions[i3]) * CONFIG.LERP_FACTOR;
                positions[i3 + 1] += (targets[i3 + 1] - positions[i3 + 1]) * CONFIG.LERP_FACTOR;
                positions[i3 + 2] += (targets[i3 + 2] - positions[i3 + 2]) * CONFIG.LERP_FACTOR;
            }

            particles.geometry.attributes.position.needsUpdate = true;
        }

        // ==================== HUD ====================
        function updateHUD() {
            // Left hand status
            let leftStatus = 'IDLE';
            if (leftHandFingers > 0) {
                if (leftHandFingers === 5) {
                    leftStatus = 'CATCH';
                } else if (currentShape) {
                    leftStatus = `${leftHandFingers}F: ${currentShape}`;
                } else {
                    leftStatus = `${leftHandFingers} FINGER${leftHandFingers > 1 ? 'S' : ''}`;
                }
            }
            document.getElementById('left-hand-display').textContent = leftStatus;

            // Right hand status
            let rightStatus = 'IDLE';
            if (rightHandFingers > 0) {
                if (rightHandFingers === 5) {
                    rightStatus = 'NEBULA';
                } else {
                    rightStatus = 'ENGAGED';
                }
            }
            document.getElementById('right-hand-display').textContent = rightStatus;

            // Combo display (basketball mode)
            const comboDisplay = document.getElementById('combo-display');
            if (isBasketballMode) {
                comboDisplay.style.display = 'block';
            } else {
                comboDisplay.style.display = 'none';
            }
        }

        function updateFPS() {
            frameCount++;
            const now = performance.now();

            if (now - lastFpsUpdate >= 500) {
                fps = Math.round(frameCount * 1000 / (now - lastFpsUpdate));
                document.getElementById('fps-display').textContent = fps;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }

        // ==================== ANIMATION LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016; // Approximate 60fps timestep

            // Handle basketball mode
            if (isBasketballMode && leftHandPos) {
                basketballRotation += 0.03;
                setBasketballShape(leftHandPos.x, leftHandPos.y, leftHandPos.z);
                // Note: Removed applyBouncingAttraction() - it was distorting sphere into pill shape
            }
            // Handle nebula mode with ripple
            else if (isNebulaMode && rightHandPos) {
                applyRippleEffect(rightHandPos.x, rightHandPos.y, rightHandPos.z);
            }
            // Handle right hand scatter (non-nebula)
            else if (rightHandPos && !isNebulaMode) {
                applyRepulsion(rightHandPos.x, rightHandPos.y);
            }

            updateParticles();
            updateFPS();
            renderer.render(scene, camera);
        }

        // ==================== INITIALIZATION ====================
        function init() {
            initThreeJS();
            createParticleSystem();
            initTextCanvas();
            initMediaPipe();

            // Start in idle mode with particles spread across screen
            idleTargets = generateIdlePositions();
            setIdleSpread();

            animate();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
